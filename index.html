<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#075cbb"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="꾹꾹 기록해"/>
<meta name="description" content="흰 고양이와 별을 모으는 아주 간단한 용돈 기록장"/><title>꾹꾹 기록해</title>
<style>
:root{--ink:#10141f;--blue:#126ecb;--cream:#fff9ef;--yellow:#ffe557;--brown:#20202c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
body{background:#081a53;overscroll-behavior:none}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:relative;margin:0 auto;width:min(100vw,480px);height:100dvh;min-height:530px;max-height:1000px;overflow:hidden;background:#0b66c3;isolation:isolate}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
#kitty{position:absolute;pointer-events:none;object-fit:contain;z-index:3;filter:none;opacity:1;transition:opacity .26s ease;image-rendering:auto}
#kitty.fading{opacity:0}
#catShadow{position:absolute;left:42%;top:55%;width:37%;height:3%;border-radius:50%;background:rgba(1,24,66,.08);filter:blur(10px);pointer-events:none}
.dynamic{position:absolute;z-index:4;font-weight:900;letter-spacing:-.055em;text-align:center;display:flex;align-items:center;justify-content:center;white-space:nowrap;pointer-events:none}
#days{left:7.5%;top:2.5%;width:43%;height:4.4%;font-size:clamp(12px,2.9vw,18px);color:#1a1b21}
#starsCount{left:24%;top:18.7%;width:56%;height:6.6%;font-size:clamp(21px,5.1vw,34px);color:#141820;letter-spacing:-.06em}
#balanceBox{position:absolute;z-index:4;left:7%;top:65.5%;width:47%;height:8.3%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.15em;padding-left:1%;color:#13151a;pointer-events:none}
#spentBox{position:absolute;z-index:4;left:70%;top:65.5%;width:25%;height:8.3%;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:.15em;color:#13151a;pointer-events:none}
.amount-label{font-size:clamp(11px,2.7vw,17px);font-weight:900;letter-spacing:-.04em;white-space:nowrap}.amount-value{font-size:clamp(21px,5vw,35px);font-weight:1000;letter-spacing:-.065em;white-space:nowrap}
#spentBox .amount-value{font-size:clamp(16px,4.2vw,28px)}
#meter{position:absolute;left:8.5%;top:75.9%;width:82.9%;height:1.53%;border-radius:20px;overflow:hidden;pointer-events:none;z-index:4;background:#fff9f0}
#meterFill{width:100%;height:100%;background:#ffe256;transition:width .65s ease}
.hot{position:absolute;z-index:6;border:0;padding:0;background:transparent;color:transparent;touch-action:manipulation}
.hot:focus-visible{outline:4px solid #fff;outline-offset:-2px;border-radius:16px}
#quick{left:4.5%;top:80.8%;width:91%;height:9.4%;border-radius:40px}
#help{right:2.5%;top:1.5%;width:13%;height:7%;border-radius:50%}
#bottom-tabs{position:absolute;left:0;bottom:0;width:100%;height:9.2%;z-index:7;display:flex}
#bottom-tabs button{width:25%;height:100%;border:0;background:transparent;color:transparent;padding:0}
#bottom-tabs button:focus-visible{outline:3px solid #fff;outline-offset:-3px;border-radius:20px}
#twinkle-layer{position:absolute;left:0;top:34%;width:100%;height:30%;z-index:2;pointer-events:none;overflow:hidden}
.added-star{position:absolute;width:7%;aspect-ratio:1;filter:drop-shadow(0 0 6px #ffe874);animation:starFade .6s cubic-bezier(.17,1.9,.33,1) both}
.added-star svg{display:block;width:100%;height:100%}
@keyframes starFade{from{opacity:0;transform:scale(.1) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
#toast{position:absolute;left:12%;right:12%;bottom:15%;z-index:22;background:#fffaf0;border:3px solid #16141b;border-radius:999px;color:#16141b;font-size:14px;text-align:center;padding:11px;box-shadow:3px 4px #0a3a79;opacity:0;pointer-events:none;transform:translateY(10px);transition:.22s}
#toast.show{opacity:1;transform:none}
#view{position:absolute;z-index:9;left:4%;right:4%;top:10.5%;bottom:10.4%;background:#fffaf0;border:4px solid #0b1526;border-radius:31px;box-shadow:5px 7px 0 #08245e;overflow:hidden;display:flex;flex-direction:column}
#view[hidden]{display:none}
.view-head{background:#ffe15a;border-bottom:4px solid #0b1526;display:flex;align-items:center;justify-content:center;padding:14px 48px;min-height:58px;font-size:clamp(22px,5vw,31px);font-weight:1000;letter-spacing:-.05em;position:relative}
.close-view{position:absolute;left:11px;top:50%;transform:translateY(-50%);background:#fffaf0;border:3px solid #101826;border-radius:50%;width:37px;height:37px;font-size:21px;font-weight:900;display:grid;place-items:center}
.view-body{padding:14px 18px 24px;overflow-y:auto;overflow-x:hidden;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.field{display:block;margin:10px 0 13px}.field-title{display:block;font-size:15px;font-weight:900;margin-bottom:7px}
.field input,.field select,.field output{display:block;width:100%;max-width:100%;min-width:0;border:3px solid #142039;border-radius:17px;background:#fff;color:#121829;padding:11px 12px;font-size:16px;line-height:1.25;outline-color:#fabf37;-webkit-appearance:none;appearance:none}
.field input[type=date]{display:block;min-height:46px;max-width:100%;padding:9px 9px;box-sizing:border-box;letter-spacing:-.03em}
.input-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.type-switch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.type-switch button,.pay-grid button,.month-strip button,.pill{border:3px solid #141b2b;background:#fff;border-radius:18px;min-height:40px;color:#14203a;font-weight:900}
.type-switch button.sel,.pay-grid button.sel{background:#ffe15c}
.pay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pay-grid button{font-size:14px;padding:5px 1px}
.primary{display:block;width:100%;border:4px solid #151b28;border-radius:26px;background:#ffe15c;color:#16141b;min-height:55px;margin-top:16px;box-shadow:0 5px 0 #b5911b;font-weight:1000;font-size:20px}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b5911b}
.muted{font-size:12px;color:#566178;margin:9px 0;line-height:1.5}.data-row{display:flex;gap:9px;align-items:center;min-width:0;background:white;border:3px solid #151c2b;border-radius:17px;padding:10px;margin:8px 0}
.data-main{flex:1;min-width:0}.data-main strong{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.data-main small{color:#58647b;font-size:12px}.data-money{font-size:16px;font-weight:900;white-space:nowrap}.data-money.negative{color:#c24156}
.tiny{border:2px solid #152033;border-radius:10px;background:#f4f8ff;padding:5px 7px;color:#152033;font-size:12px;font-weight:900}
.month-strip{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}.month-strip button{min-width:39px}.month-strip strong{font-size:15px}
.summary{border:3px solid #1a2132;border-radius:21px;background:#ffe983;padding:14px 10px;text-align:center;margin:10px 0;font-size:14px;font-weight:900}
.summary strong{display:block;font-size:clamp(22px,5vw,34px);margin-top:6px}
.chip{background:#eff7ff;border:2px solid #25385c;padding:8px;border-radius:12px;font-weight:800;font-size:14px;margin:7px 0}
.bar-row{display:grid;grid-template-columns:54px minmax(0,1fr) 82px;align-items:center;gap:6px;margin:13px 0;font-size:13px;font-weight:800}
.track{background:#e8e9e6;border-radius:30px;height:15px;overflow:hidden;border:2px solid #1d2840}.track span{display:block;height:100%;background:#ffe15b;border-radius:30px}
.settings-grid{display:grid;gap:9px}.settings-button{width:100%;border:3px solid #152039;border-radius:14px;padding:12px 8px;background:#fff;font-weight:900;text-align:center;color:#171d2c}
#intro{position:absolute;inset:0;background:#0657ac;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;padding:40px;transition:opacity .7s ease}
#intro[hidden]{display:none!important}#intro.hide{opacity:0;pointer-events:none}#intro .intro-cloud{border:5px solid #16203e;background:#fffaf0;border-radius:48%;padding:30px;color:#121724;font-weight:1000;font-size:clamp(28px,9vw,48px);box-shadow:7px 9px #072b71}
#intro p{font-weight:800;font-size:15px;line-height:1.6}
@media (max-height:630px){#view{top:3%;bottom:10%}.view-body{padding-top:8px}.field{margin:7px 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

const $=id=>document.getElementById(id);const nfmt=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let state=(()=>{try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.records))return {budget:Number(v.budget)||400000,records:v.records.filter(r=>r&&typeof r.date==='string'&&Number(r.amount)>0),motion:v.motion!==false}}catch(e){}return{budget:400000,records:[],motion:true}})();
let page='home',selectedMonth=today().slice(0,7),editing=null,kind='expense',method='',frameIndex=0,lastToast=0,animationTimer=0;
const poses=['main','look','sniff','tap','roll','cuddle','rest'];
const poseCfg={main:{l:38.125,t:35.635,w:46.875,h:22.86},look:{l:37,t:40,w:36,h:19},sniff:{l:33,t:39,w:43,h:21},tap:{l:34,t:39,w:43,h:21},roll:{l:34,t:39,w:43,h:21},cuddle:{l:36,t:40,w:40,h:20},rest:{l:33,t:40,w:42,h:20}};
function pose(p){const im=$('kitty'),c=poseCfg[p];im.classList.add('fading');setTimeout(()=>{im.src=CAT[p];im.style.left=c.l+'%';im.style.top=c.t+'%';im.style.width=c.w+'%';im.style.height=c.h+'%';im.classList.remove('fading')},180)}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요. 기록을 백업해 주세요')}};
const monthRows=(m=today().slice(0,7))=>state.records.filter(r=>r.date.slice(0,7)===m);
function stats(m=today().slice(0,7)){let rec=monthRows(m);let spent=rec.filter(r=>r.type!=='income').reduce((s,r)=>s+Number(r.amount),0),inc=rec.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);let days=new Set(rec.map(r=>r.date)).size;return{rec,spent,inc,balance:state.budget+inc-spent,days,stars:rec.filter(r=>r.type!=='income').length}}
function toast(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(lastToast);lastToast=setTimeout(()=>el.classList.remove('show'),2400)};
function stars(){const box=$('twinkle-layer');box.innerHTML='';let total=Math.min(16,stats().stars);let spots=[[22,75],[65,16],[7,57],[89,64],[48,17],[13,30],[78,34],[35,44],[55,82],[4,80],[88,11],[44,54],[71,83],[29,21],[62,51],[90,87]];
 for(let i=0;i<total;i++){let e=document.createElement('div');e.className='added-star';e.style.left=spots[i][0]+'%';e.style.top=spots[i][1]+'%';e.innerHTML='<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 4 37 22 56 23 41 35 46 55 30 44 14 55 19 35 4 23 23 22Z" fill="#ffdf42" stroke="#101820" stroke-width="4.5" stroke-linejoin="round"/></svg>';box.appendChild(e)}}
function updateHome(){let t=stats();$('days').textContent=`이번 달 ${t.days}일 기록했어요`;$('starsCount').textContent=`반짝이는 별 ${t.stars}개`;$('balanceVal').textContent=nfmt(t.balance);$('spentVal').textContent=nfmt(t.spent);$('meterFill').style.width=Math.max(0,Math.min(100,state.budget?100*t.balance/state.budget:0))+'%';stars()}
function idle(){clearInterval(animationTimer);if(!state.motion){pose('main');return}animationTimer=setInterval(()=>{if(page!=='home')return;frameIndex=(frameIndex+1)%poses.length;pose(poses[frameIndex])},4600)}
function escaped(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openPage(p){page=p;const v=$('view');if(p==='home'){v.hidden=true;idle();return}clearInterval(animationTimer);v.hidden=false;$('viewTitle').textContent=({write:editing?'기록 수정':'기록하기',history:'기록',report:'리포트',settings:'설정'})[p]||'기록';renderPage();}
function renderPage(){if(page==='write')renderWrite();else if(page==='history')renderHistory();else if(page==='report')renderReport();else if(page==='settings')renderSettings()}
function newRecord(){editing=null;kind='expense';method='';openPage('write')}
function renderWrite(){let r=state.records.find(x=>x.id===editing);if(r){kind=r.type||'expense';method=r.method||''};let b=$('viewBody');b.innerHTML=`
<div class="type-switch"><button type="button" data-type="expense" class="${kind==='expense'?'sel':''}">지출</button><button type="button" data-type="income" class="${kind==='income'?'sel':''}">추가 수입</button></div>
<form id="recordForm"><label class="field"><span class="field-title">기록 날짜</span><input id="fieldDate" type="date" required value="${escaped(r?.date||today())}"/></label>
<label class="field"><span class="field-title">금액 <small>(필수)</small></span><input type="number" id="fieldAmount" min="1" max="1000000000" inputmode="numeric" placeholder="얼마를 썼나요?" required value="${r?Number(r.amount):''}"/></label>
<label class="field"><span class="field-title">내용 <small>(선택)</small></span><input id="fieldMemo" type="text" maxlength="60" placeholder="예: 간식, 문구, 교통비" value="${escaped(r?.memo||'')}"/></label>
<div class="field"><span class="field-title">결제수단 <small>(선택)</small></span><div class="pay-grid"><button type="button" data-method="현금">현금</button><button type="button" data-method="카드">카드</button><button type="button" data-method="이체">이체</button></div></div>
<div class="muted">결제수단을 선택하지 않아도 저장돼요. 이미 선택한 버튼은 다시 누르면 해제돼요.</div>
<button class="primary" type="submit">${editing?'수정 저장하기':'저장하고 별 만들기'}</button></form>`;
 b.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{kind=el.dataset.type;b.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('sel',x.dataset.type===kind))});
 function paintMethods(){b.querySelectorAll('[data-method]').forEach(x=>x.classList.toggle('sel',x.dataset.method===method))}b.querySelectorAll('[data-method]').forEach(el=>el.onclick=()=>{method=method===el.dataset.method?'':el.dataset.method;paintMethods()});paintMethods();$('recordForm').onsubmit=saveRecord}
function saveRecord(event){event.preventDefault();let date=$('fieldDate').value,amount=Number($('fieldAmount').value),memo=$('fieldMemo').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isSafeInteger(amount)||amount<=0||amount>1000000000){toast('날짜와 금액을 확인해 주세요');return}let old=state.records.find(r=>r.id===editing);if(old){Object.assign(old,{date,amount,memo,method,type:kind,category:''})}else{state.records.push({id:(crypto.randomUUID?.()||Date.now()+'-'+Math.random()),date,amount,memo,method,type:kind,category:'',created:Date.now()})}let wasNew=!old;editing=null;persist();updateHome();openPage('home');toast(wasNew&&kind==='expense'?'반짝! 별이 하나 생겼어요':'기록을 저장했어요');if(wasNew&&kind==='expense'){pose('tap');setTimeout(()=>{if(page==='home')pose('cuddle')},1000);setTimeout(()=>{if(page==='home')pose('main')},2700)}}
function moveMonth(delta){const [yy,mm]=selectedMonth.split('-').map(Number);const d=new Date(yy,mm-1+delta,1);selectedMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderPage()}
function monthHead(){return `<div class="month-strip"><button type="button" id="prevMonth">‹</button><strong>${selectedMonth.replace('-','년 ')}월</strong><button type="button" id="nextMonth">›</button></div>`}
function connectMonth(){const a=$('prevMonth'),b=$('nextMonth');if(a)a.onclick=()=>moveMonth(-1);if(b)b.onclick=()=>moveMonth(1)}
function renderHistory(){let b=$('viewBody'),s=stats(selectedMonth),rows=s.rec.slice().sort((a,b)=>b.date.localeCompare(a.date)||Number(b.created||0)-Number(a.created||0));b.innerHTML=monthHead()+`<div class="summary">이번 달 사용<strong>${nfmt(s.spent)}</strong></div>`+(rows.length?rows.map(r=>`<div class="data-row"><div class="data-main"><strong>${escaped(r.memo|| (r.type==='income'?'추가 수입':'지출'))}</strong><small>${r.date.slice(5).replace('-','.')} · ${escaped(r.method||'결제수단 미선택')}</small></div><span class="data-money ${r.type==='income'?'':'negative'}">${r.type==='income'?'+':'−'}${nfmt(r.amount)}</span><button class="tiny" data-edit="${escaped(r.id)}">수정</button><button class="tiny" data-del="${escaped(r.id)}">삭제</button></div>`).join(''):'<p class="muted">이 달에는 기록이 없어요. 별을 하나 만들어 볼까요?</p>')+`<button class="primary" id="fromHistory">＋ 기록하기</button>`;connectMonth();b.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{editing=el.dataset.edit;openPage('write')});b.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(!confirm('이 기록을 삭제할까요?'))return;state.records=state.records.filter(r=>r.id!==el.dataset.del);persist();updateHome();renderHistory();toast('기록을 삭제했어요')});$('fromHistory').onclick=newRecord}
function renderReport(){let b=$('viewBody'),s=stats(selectedMonth),remaining=s.balance,usedpct=state.budget?Math.max(0,Math.min(100,Math.round(s.spent/state.budget*100))):0;let groups={};for(const r of s.rec.filter(r=>r.type!=='income')){let d=r.date.slice(-2);groups[d]=(groups[d]||0)+Number(r.amount)}let mx=Math.max(1,...Object.values(groups));b.innerHTML=monthHead()+`<div class="summary">이번 달 사용 금액<strong>${nfmt(s.spent)}</strong></div><div class="chip">남은 용돈 ${nfmt(remaining)}　·　추가 수입 ${nfmt(s.inc)}</div><div class="chip">사용 비율 ${usedpct}%　·　이번 달 별 ${s.stars}개</div><p class="field-title">날짜별 지출</p>`+(Object.keys(groups).length?Object.keys(groups).sort((a,b)=>Number(b)-Number(a)).map(d=>`<div class="bar-row"><span>${Number(d)}일</span><div class="track"><span style="width:${100*groups[d]/mx}%"></span></div><span style="text-align:right">${nfmt(groups[d])}</span></div>`).join(''):'<p class="muted">아직 기록이 없어요.</p>');connectMonth()}
function renderSettings(){let b=$('viewBody');b.innerHTML=`<form id="settingsForm"><label class="field"><span class="field-title">한 달 용돈</span><input type="number" id="budgetInput" min="0" max="1000000000" inputmode="numeric" value="${state.budget}"/></label><label class="field"><span class="field-title">고양이 모션</span><select id="motionInput"><option value="on" ${state.motion?'selected':''}>켜기 (자세가 바뀌는 애니메이션)</option><option value="off" ${!state.motion?'selected':''}>끄기 (원본 자세 고정)</option></select></label><p class="muted">월별 예산은 매월 1일부터 계산해요. 기록은 이 기기의 브라우저에 저장돼요.</p><button class="primary">설정 저장하기</button></form><div class="settings-grid" style="margin-top:16px"><button class="settings-button" id="exportData">기록 백업 파일 받기</button><label class="settings-button" style="display:block">기록 백업 불러오기<input id="importData" type="file" accept="application/json" style="display:block;margin-top:5px;font-size:12px;max-width:100%"/></label></div>`;
$('settingsForm').onsubmit=e=>{e.preventDefault();let n=Number($('budgetInput').value);if(!Number.isSafeInteger(n)||n<0||n>1000000000)return toast('용돈 금액을 확인해 주세요');state.budget=n;state.motion=$('motionInput').value==='on';persist();updateHome();openPage('home');toast('설정을 저장했어요')};
$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='꾹꾹기록해-백업-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
$('importData').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.records)||!confirm('기존 기록을 백업 파일의 기록으로 바꿀까요?'))return;state={budget:Number(v.budget)||400000,records:v.records.filter(r=>r&&typeof r.date==='string'&&Number(r.amount)>0),motion:v.motion!==false};persist();updateHome();renderSettings();toast('백업을 불러왔어요')}catch(err){toast('올바른 백업 파일이 아니에요')}}}
$('quick').onclick=newRecord;$('help').onclick=()=>alert('지출 금액만 입력해도 기록할 수 있어요.\n기록할 때마다 별이 하나씩 생겨요.\n고양이는 별을 살피거나 냄새 맡으며 놀아요.');$('back').onclick=()=>openPage('home');document.querySelectorAll('#bottom-tabs button').forEach(el=>el.onclick=()=>{if(el.dataset.page==='home')openPage('home');else openPage(el.dataset.page)});
updateHome();pose('main');idle();
// 시작 화면의 제목은 첫 실행 때만 짧게 표시하고, 평소 홈에서는 보이지 않게 합니다.
try{if(!sessionStorage.getItem('kkukkkuk-started-this-session')){
 const opening=$('intro');opening.hidden=false;
 sessionStorage.setItem('kkukkkuk-started-this-session','1');
 setTimeout(()=>{opening.classList.add('hide');setTimeout(()=>{opening.hidden=true;opening.classList.remove('hide')},420)},650);
}}catch(err){$('intro').hidden=true;}
})();
</script></body></html>
