<script>
(()=>{'use strict';
const KEY='kkukkkuk-recordhae-v1';const $=id=>document.getElementById(id);const DAY=86400000;
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateFrom=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Array.isArray(state.records))state={budget:400000,records:[],motion:true};state.budget=Number.isFinite(+state.budget)?Math.max(0,+state.budget):400000;state.records=state.records.filter(r=>r&&/^\d{4}-\d\d-\d\d$/.test(r.date)&&+r.amount>0);if(state.motion===undefined)state.motion=true;
let page='home',editId=null,kind='expense',payment='',month=localDate().slice(0,7),timers=[],toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('저장 공간이 부족해요. 백업을 확인해 주세요')}}
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function monthly(m=localDate().slice(0,7)){const rows=state.records.filter(r=>r.date.startsWith(m));const spent=rows.filter(r=>r.type!=='income').reduce((a,r)=>a+Number(r.amount),0),income=rows.filter(r=>r.type==='income').reduce((a,r)=>a+Number(r.amount),0);return{rows,spent,income,remaining:state.budget+income-spent,days:new Set(rows.map(r=>r.date)).size}}
function streak(){const set=new Set(state.records.filter(r=>r.date<=localDate()).map(r=>r.date));let cur=dateFrom(localDate());if(!set.has(localDate(cur)))cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1,12);let n=0;while(n<365&&set.has(localDate(cur))){n++;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1,12)}return n}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function after(fn,ms){timers.push(setTimeout(fn,ms))}
function weather(animate=false){clearTimers();const s=$('scene');let n=streak(),level=Math.min(3,n);s.dataset.stage=String(level);s.classList.remove('budding','bloomed','splash','growing');
 const labels=['아직 기록이 없어요','1일 기록!','2일 연속 기록!','3일 연속 기록!'];const subs=['맑은 하늘과 빈 풀밭이에요','오늘도 기록했어요','먹구름이 모이고 있어요','빗방울이 닿으면 꽃이 피어요'];$('weather-title').textContent=labels[level];$('weather-sub').textContent=subs[level];
 if(level===3){if(!animate||!state.motion||matchMedia('(prefers-reduced-motion: reduce)').matches){s.classList.add('bloomed');return}
  after(()=>s.classList.add('splash'),1500);after(()=>s.classList.add('growing'),2200);after(()=>{s.classList.remove('growing');s.classList.add('budding')},3500);after(()=>{s.classList.add('bloomed');$('weather-live').textContent='빗방울이 닿아 꽃이 피었어요!'},6200);
 }}
function updateHome(animate=false){const m=monthly();$('remaining').textContent=fmt(m.remaining);$('spent').textContent=fmt(m.spent);const percent=state.budget?Math.min(100,Math.max(0,m.remaining/state.budget*100)):0;$('balance-bar').style.width=percent+'%';weather(animate)}
// Rain particles are independent of the illustrated cat and meadow; no full-background flutter.
const rain=$('rain');for(let i=0;i<24;i++){const d=document.createElement('span');d.className='drop';d.style.setProperty('--x',((i*41+19)%94+2)+'%');d.style.setProperty('--s',(1.2+(i%5)*.19)+'s');d.style.setProperty('--d',(-i*.37)+'s');rain.appendChild(d)}
function open(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('detail').hidden=p==='home';if(p==='home'){updateHome(false);return}$('detail-title').textContent=({write:editId?'기록 수정':'기록하기',history:'기록',report:'리포트',settings:'설정'})[p];render()}
function newEntry(){editId=null;payment='';kind='expense';open('write')}
function render(){if(page==='write')renderWrite();if(page==='history')renderHistory();if(page==='report')renderReport();if(page==='settings')renderSettings()}
function renderWrite(){const r=state.records.find(r=>String(r.id)===String(editId));if(r){payment=r.method||'';kind=r.type||'expense'}
 $('detail-body').innerHTML=`<div class="sheet"><div class="type-row"><button type="button" data-kind="expense" class="${kind==='expense'?'on':''}">지출</button><button type="button" data-kind="income" class="${kind==='income'?'on':''}">추가 수입</button></div><form id="entry-form"><label class="field"><span>금액 (필수)</span><input type="number" id="input-amount" min="1" max="999999999" required inputmode="numeric" placeholder="얼마를 썼나요?" value="${r?Number(r.amount):''}"></label><label class="field"><span>기록 날짜 (필수)</span><input type="date" id="input-date" required value="${r?.date||localDate()}"></label><label class="field"><span>내용 <small>(선택)</small></span><input id="input-memo" maxlength="80" placeholder="예: 간식, 교통비" value="${esc(r?.memo||'')}"></label><div class="field"><span>결제수단 <small>(선택)</small></span><div class="choice"><button type="button" data-pay="현금">현금</button><button type="button" data-pay="카드">카드</button><button type="button" data-pay="이체">이체</button></div><small>선택하지 않아도 저장돼요.</small></div><button class="primary" type="submit">${editId?'수정 저장하기':'기록 저장하기'}</button></form></div>`;
 const b=$('detail-body');b.querySelectorAll('[data-kind]').forEach(x=>x.onclick=()=>{kind=x.dataset.kind;b.querySelectorAll('[data-kind]').forEach(v=>v.classList.toggle('on',v.dataset.kind===kind))});
 const paint=()=>b.querySelectorAll('[data-pay]').forEach(x=>x.classList.toggle('on',x.dataset.pay===payment));b.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>{payment=payment===x.dataset.pay?'':x.dataset.pay;paint()});paint();$('entry-form').onsubmit=save}
function save(e){e.preventDefault();const date=$('input-date').value,amount=Number($('input-amount').value),memo=$('input-memo').value.trim();if(!/^\d{4}-\d\d-\d\d$/.test(date)||!Number.isSafeInteger(amount)||amount<=0||amount>999999999)return notify('날짜와 금액을 확인해 주세요');
 const before=streak();const old=state.records.find(r=>String(r.id)===String(editId));if(old)Object.assign(old,{date,amount,memo,method:payment,type:kind});else state.records.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),created:Date.now(),date,amount,memo,method:payment,type:kind});persist();open('home');const afterStreak=streak();updateHome(afterStreak>=3&&before<3);notify(old?'수정했어요':'오늘도 기록했어요!')}
function monthHeader(){const [y,m]=month.split('-');return `<div class="month-nav"><button id="prev-month" type="button" aria-label="지난달">‹</button>${y}년 ${Number(m)}월<button id="next-month" type="button" aria-label="다음달">›</button></div>`}
function monthActions(){const flip=n=>{const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()};$('prev-month').onclick=()=>flip(-1);$('next-month').onclick=()=>flip(1)}
function renderHistory(){const m=monthly(month),rows=m.rows.slice().sort((a,b)=>b.date.localeCompare(a.date)||Number(b.created||0)-Number(a.created||0));$('detail-body').innerHTML=monthHeader()+`<section class="sheet summary">이번 달 사용<strong>${fmt(m.spent)}</strong></section><section class="sheet">${rows.length?rows.map(r=>`<div class="entry"><div class="grow"><strong>${esc(r.memo||'용돈 기록')}</strong><small>${esc(r.date.slice(5).replace('-','.'))} · ${esc(r.method||'결제수단 미선택')}</small></div><span class="price">${r.type==='income'?'+':'−'}${fmt(r.amount)}</span><button data-edit="${esc(r.id)}">수정</button><button data-delete="${esc(r.id)}">삭제</button></div>`).join(''):'<div class="empty">아직 기록이 없어요.</div>'}</section>`;monthActions();$('detail-body').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('이 기록을 삭제할까요?'))return;state.records=state.records.filter(r=>String(r.id)!==b.dataset.delete);persist();renderHistory();notify('기록을 삭제했어요')});$('detail-body').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;open('write')})}
function renderReport(){const m=monthly(month);const bydate={};m.rows.filter(r=>r.type!=='income').forEach(r=>{const d=Number(r.date.slice(-2));bydate[d]=(bydate[d]||0)+Number(r.amount)});const max=Math.max(1,...Object.values(bydate));const lastDay=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();const bars=Array.from({length:lastDay},(_,i)=>({day:i+1,amount:bydate[i+1]||0})).filter((_,i)=>i%Math.max(1,Math.floor(lastDay/8))===0||bydate[i+1]);$('detail-body').innerHTML=monthHeader()+`<div class="sheet"><div class="report-grid"><div><small>이번 달 지출</small><strong>${fmt(m.spent)}</strong></div><div><small>남은 용돈</small><strong>${fmt(m.remaining)}</strong></div><div><small>기록한 날</small><strong>${m.days}일</strong></div><div><small>연속 기록</small><strong>${streak()}일</strong></div></div></div><section class="sheet"><strong>날짜별 지출</strong><div class="chart">${bars.map(x=>`<div class="bar-col"><div class="bar" title="${x.day}일 ${fmt(x.amount)}" style="height:${Math.max(3,x.amount/max*110)}px"></div><span>${x.day}일</span></div>`).join('')}</div></section><section class="sheet"><p class="hint">3일 연속 기록하면 비가 내려 꽃이 피어나요. 매월 기록과 지출 내역은 따로 보관돼요.</p></section>`;monthActions()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function renderSettings(){$('detail-body').innerHTML=`<section class="sheet"><form id="setting-form"><label class="field"><span>한 달 용돈</span><input id="budget-input" type="number" inputmode="numeric" min="0" max="999999999" value="${state.budget}" required></label><label class="field switch"><span>고양이·꽃 애니메이션</span><input id="motion-input" type="checkbox" ${state.motion?'checked':''}></label><p class="hint">매월 1일 새 용돈 기간이 시작돼요. 기록은 이 기기의 브라우저에 저장돼요.</p><button class="primary" type="submit">설정 저장하기</button></form></section><section class="sheet"><strong>기록 백업</strong><button id="backup" class="setting-btn">기록 백업 파일 받기</button><button id="restore-btn" class="setting-btn">기록 백업 불러오기</button><input type="file" id="restore-file" accept="application/json,.json" hidden><p class="hint">앱을 업데이트하기 전에 백업을 받아 두면 안전해요.</p></section>`;
 $('setting-form').onsubmit=e=>{e.preventDefault();let n=Number($('budget-input').value);if(!Number.isSafeInteger(n)||n<0||n>999999999)return notify('용돈 금액을 확인해 주세요');state.budget=n;state.motion=$('motion-input').checked;persist();open('home');notify('설정을 저장했어요')};
 $('backup').onclick=()=>download('꾹꾹기록해-백업-'+localDate()+'.json',JSON.stringify(state,null,2),'application/json');$('restore-btn').onclick=()=>$('restore-file').click();$('restore-file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.records)||!confirm('현재 기록을 백업 파일로 교체할까요?'))return;state={budget:Number(d.budget)||400000,records:d.records.filter(r=>r&&typeof r.date==='string'&&+r.amount>0),motion:d.motion!==false};persist();open('home');notify('백업을 복원했어요')}catch(e){notify('백업 파일을 확인해 주세요')}}}
$('record-primary').onclick=newEntry;$('back').onclick=()=>open('home');$('help').onclick=()=>alert('1일 기록: 맑은 하늘과 해가 보여요.\n2일 연속: 구름이 회색으로 변해요.\n3일 연속: 비가 내리고 꽃이 피어요.\n\n금액과 날짜만 입력해도 저장할 수 있어요.');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='write')return newEntry();open(b.dataset.page)});
// Add a secondary records entry through the header of the report page for easy browsing.
const oldRenderReport=renderReport;renderReport=function(){oldRenderReport();const b=document.createElement('button');b.className='setting-btn';b.textContent='기록 내역 보기';b.onclick=()=>open('history');$('detail-body').prepend(b)};
// URL demo selectors are for comparing weather stages only and never write to the saved ledger.
const demos=new URLSearchParams(location.search);let demo=demos.get('demo');if(['0','1','2','3'].includes(demo)){const savedWeather=weather;weather=function(){const stage=Number(demo),s=$('scene');clearTimers();s.dataset.stage=demo;s.classList.remove('budding','bloomed','growing','splash');$('weather-title').textContent=['아직 기록이 없어요','1일 기록!','2일 연속 기록!','3일 연속 기록!'][stage];$('weather-sub').textContent=['맑은 하늘과 빈 풀밭이에요','오늘도 기록했어요','먹구름이 모이고 있어요','빗방울이 닿으면 꽃이 피어요'][stage];if(stage===3){s.classList.add('bloomed')}}}
updateHome(false);
})();
</script></body></html>
